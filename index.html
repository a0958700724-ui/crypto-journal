<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Journal - 智能覆盤編輯版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
        html { overflow-y: auto !important; height: auto !important; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-7xl mx-auto pb-12">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 border-b border-gray-800 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400"><i class="fa-solid fa-layer-group mr-2"></i>Crypto Journal 終極同步版</h1>
                <p class="text-sm text-gray-400">支援 4 時框圖片、歷史紀錄隨時編輯更新、手機/電腦同步</p>
            </div>
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 text-xs w-full sm:w-auto">
                <div class="font-bold text-indigo-400 mb-1"><i class="fa-solid fa-gear mr-1"></i>雲端同步設定</div>
                <div class="flex flex-col gap-1.5">
                    <input type="url" id="sheet-api" placeholder="請貼上 Google Web App 網址" class="bg-gray-800 p-1.5 rounded text-gray-300 w-full sm:w-64 focus:outline-none focus:border-indigo-500">
                    <div class="flex gap-2">
                        <button onclick="saveApiUrl()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-1 rounded cursor-pointer w-1/2 font-bold">儲存設定</button>
                        <button onclick="syncFromCloud()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded cursor-pointer w-1/2 font-bold"><i class="fa-solid fa-rotate mr-1"></i>手動同步</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800"><div>總交易筆數</div><div id="stat-total" class="text-2xl font-bold text-slate-200">0</div></div>
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800"><div>總勝率</div><div id="stat-winrate" class="text-2xl font-bold text-emerald-400">0%</div></div>
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800"><div>平均盈虧比</div><div id="stat-rr" class="text-2xl font-bold text-indigo-400">0.00</div></div>
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800"><div>累積總損益</div><div id="stat-profit" class="text-2xl font-bold text-slate-200">0.00 USDT</div></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 h-fit lg:sticky lg:top-4">
                <div id="form-title" class="text-base font-bold text-indigo-400 mb-3 flex items-center"><i class="fa-solid fa-pen-to-square mr-2"></i><span>新增覆盤紀錄</span></div>
                <form id="trade-form" class="space-y-4 text-sm">
                    <input type="hidden" id="edit-id">
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="text-gray-400">交易對</label><input type="text" id="symbol" class="w-full bg-gray-800 rounded p-2 uppercase" required></div>
                        <div><label class="text-gray-400">方向/槓桿</label><div class="flex gap-1"><select id="side" class="w-1/2 bg-gray-800 rounded p-2"><option value="Long">做多</option><option value="Short">做空</option></select><input type="number" id="leverage" class="w-1/2 bg-gray-800 rounded p-2" required></div></div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div><label class="text-gray-400">進場點</label><input type="number" step="any" id="entry" class="w-full bg-gray-800 rounded p-2" required></div>
                        <div><label class="text-gray-400">初始止盈</label><input type="number" step="any" id="tp" class="w-full bg-gray-800 rounded p-2"></div>
                        <div><label class="text-gray-400">初始止損</label><input type="number" step="any" id="sl" class="w-full bg-gray-800 rounded p-2"></div>
                    </div>
                    <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 space-y-2">
                        <div class="text-xs font-bold text-amber-500">動態調整紀錄</div>
                        <input type="text" id="mod1" placeholder="第一次調整 (新TP/SL)" class="w-full bg-gray-800 rounded p-1.5 text-xs"><input type="text" id="reason1" placeholder="調整原因" class="w-full bg-gray-800 rounded p-1.5 text-xs">
                        <input type="text" id="mod2" placeholder="第二次調整 (新TP/SL)" class="w-full bg-gray-800 rounded p-1.5 text-xs"><input type="text" id="reason2" placeholder="調整原因" class="w-full bg-gray-800 rounded p-1.5 text-xs">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="text-gray-400">實際出場點</label><input type="number" step="any" id="exit" class="w-full bg-gray-800 rounded p-2"></div>
                        <div><label class="text-gray-400">實際盈虧(USDT)</label><input type="number" step="any" id="pnl" class="w-full bg-gray-800 rounded p-2" required></div>
                    </div>
                    <div><label class="text-gray-400">開單基本理由</label><input type="text" id="reason" class="w-full bg-gray-800 rounded p-2" placeholder="例如：日線級別支撐趨勢線破位" required></div>
                    
                    <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 space-y-2">
                        <div class="text-xs font-bold text-indigo-400"><i class="fa-solid fa-images mr-1"></i>TradingView 多時框圖片連結</div>
                        <input type="url" id="tvUrl1" placeholder="圖 1：大時框趨勢 (如 日線/4H)" class="w-full bg-gray-800 rounded p-1.5 text-xs">
                        <input type="url" id="tvUrl2" placeholder="圖 2：中時框結構 (如 1H)" class="w-full bg-gray-800 rounded p-1.5 text-xs">
                        <input type="url" id="tvUrl3" placeholder="圖 3：小時框進場點 (如 15M/5M)" class="w-full bg-gray-800 rounded p-1.5 text-xs">
                        <input type="url" id="tvUrl4" placeholder="圖 4：平倉/出場截圖 (選填)" class="w-full bg-gray-800 rounded p-1.5 text-xs">
                    </div>

                    <div>
                        <label class="text-gray-400 font-bold block mb-1 text-indigo-400"><i class="fa-solid fa-pen-to-square mr-1"></i>詳細覆盤心得與檢討</label>
                        <textarea id="notes" rows="4" class="w-full bg-gray-800 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="打下你對這筆單的詳細覆盤筆記..."></textarea>
                    </div>

                    <div class="flex gap-2">
                        <button type="button" id="cancel-edit-btn" onclick="exitEditMode()" class="hidden w-1/3 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded cursor-pointer">取消</button>
                        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded cursor-pointer">儲存覆盤紀錄</button>
                    </div>
                </form>
            </div>
            <div class="lg:col-span-2 space-y-4">
                <h2 class="text-lg font-bold text-indigo-400 flex justify-between items-center border-b border-gray-800 pb-2">
                    <span>歷史交易覆盤清單</span>
                    <button onclick="clearAllData()" class="text-xs text-rose-400 cursor-pointer">清空本地</button>
                </h2>
                <div id="trades-container" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        let trades = JSON.parse(localStorage.getItem('crypto_journal_trades')) || [];
        let isEditing = false;
        
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('crypto_sheet_api_url');
            if(savedUrl) {
                document.getElementById('sheet-api').value = savedUrl;
                syncFromCloud();
            }
            renderStats();
            renderTrades();
        });

        function saveApiUrl() {
            const url = document.getElementById('sheet-api').value.trim();
            localStorage.setItem('crypto_sheet_api_url', url);
            alert('雲端同步網址儲存成功！');
            if(url) syncFromCloud();
        }

        document.getElementById('trade-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const editId = document.getElementById('edit-id').value;
            
            const tradeData = {
                symbol: document.getElementById('symbol').value.toUpperCase(), 
                side: document.getElementById('side').value, 
                leverage: document.getElementById('leverage').value,
                entry: document.getElementById('entry').value, 
                tp: document.getElementById('tp').value || '-', 
                sl: document.getElementById('sl').value || '-',
                mod1: document.getElementById('mod1').value || '-', 
                reason1: document.getElementById('reason1').value || '-', 
                mod2: document.getElementById('mod2').value || '-', 
                reason2: document.getElementById('reason2').value || '-',
                exit: document.getElementById('exit').value || '-', 
                pnl: parseFloat(document.getElementById('pnl').value), 
                reason: document.getElementById('reason').value, 
                tvUrl1: document.getElementById('tvUrl1').value || '-',
                tvUrl2: document.getElementById('tvUrl2').value || '-',
                tvUrl3: document.getElementById('tvUrl3').value || '-',
                tvUrl4: document.getElementById('tvUrl4').value || '-',
                notes: document.getElementById('notes').value || '-'
            };

            const apiUrl = localStorage.getItem('crypto_sheet_api_url');
            btn.disabled = true;

            if (isEditing && editId) {
                tradeData.id = parseInt(editId);
                const index = trades.findIndex(t => t.id === tradeData.id);
                if(index !== -1) trades[index] = tradeData;
                
                if(apiUrl) {
                    btn.innerText = '正在雲端更新此筆資料...';
                    try {
                        await fetch(apiUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'update', data: tradeData })
                        });
                    } catch(err) { console.error(err); }
                }
                exitEditMode();
            } else {
                tradeData.id = Date.now();
                trades.unshift(tradeData);
                if(apiUrl) {
                    btn.innerText = '正在同步至雲端試算表...';
                    try {
                        await fetch(apiUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'add', data: tradeData })
                        });
                    } catch(err) { console.error(err); }
                }
            }

            btn.innerText = '儲存覆盤紀錄';
            btn.disabled = false;
            saveAndRender();
            e.target.reset();
        });

        function startEdit(id) {
            isEditing = true;
            const t = trades.find(item => item.id === id);
            if (!t) return;

            document.getElementById('edit-id').value = t.id;
            document.getElementById('symbol').value = t.symbol;
            document.getElementById('side').value = t.side;
            document.getElementById('leverage').value = t.leverage;
            document.getElementById('entry').value = t.entry;
            document.getElementById('tp').value = t.tp === '-' ? '' : t.tp;
            document.getElementById('sl').value = t.sl === '-' ? '' : t.sl;
            document.getElementById('mod1').value = t.mod1 === '-' ? '' : t.mod1;
            document.getElementById('reason1').value = t.reason1 === '-' ? '' : t.reason1;
            document.getElementById('mod2').value = t.mod2 === '-' ? '' : t.mod2;
            document.getElementById('reason2').value = t.reason2 === '-' ? '' : t.reason2;
            document.getElementById('exit').value = t.exit === '-' ? '' : t.exit;
            document.getElementById('pnl').value = t.pnl;
            document.getElementById('reason').value = t.reason;
            document.getElementById('tvUrl1').value = t.tvUrl1 === '-' ? '' : t.tvUrl1;
            document.getElementById('tvUrl2').value = t.tvUrl2 === '-' ? '' : t.tvUrl2;
            document.getElementById('tvUrl3').value = t.tvUrl3 === '-' ? '' : t.tvUrl3;
            document.getElementById('tvUrl4').value = t.tvUrl4 === '-' ? '' : t.tvUrl4;
            document.getElementById('notes').value = t.notes === '-' ? '' : t.notes;

            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-user-pen mr-2"></i>修改交易覆盤中';
            document.getElementById('form-title').className = "text-base font-bold text-amber-400 mb-3 flex items-center";
            document.getElementById('submit-btn').innerText = '確認修改此單';
            document.getElementById('submit-btn').className = "w-2/3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded cursor-pointer";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function exitEditMode() {
            isEditing = false;
            document.getElementById('trade-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-pen-to-square mr-2"></i><span>新增覆盤紀錄</span>';
            document.getElementById('form-title').className = "text-base font-bold text-indigo-400 mb-3 flex items-center";
            document.getElementById('submit-btn').innerText = '儲存覆盤紀錄';
            document.getElementById('submit-btn').className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded cursor-pointer";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        async function syncFromCloud() {
            const apiUrl = localStorage.getItem('crypto_sheet_api_url');
            if(!apiUrl) return;
            const container = document.getElementById('trades-container');
            container.innerHTML = '<div class="text-amber-400 py-4 text-sm text-center"><i class="fa-solid fa-spinner animate-spin mr-2"></i>正在同步跨裝置雲端數據...</div>';

            try {
                const res = await fetch(apiUrl + '?action=get');
                const cloudData = await res.json();
                if(Array.isArray(cloudData)) {
                    trades = cloudData.reverse(); 
                    saveAndRender();
                }
            } catch(err) {
                renderTrades();
            }
        }

        function saveAndRender() { 
            localStorage.setItem('crypto_journal_trades', JSON.stringify(trades)); 
            renderStats(); 
            renderTrades(); 
        }
        
        function deleteTrade(id) { 
            if(confirm('確定刪除？(請記得同步至雲端試算表手動刪除該列喔)')) { 
                trades = trades.filter(t => t.id !== id); 
                saveAndRender(); 
            } 
        }
        
        function clearAllData() { if(confirm('確定清空本地紀錄？')) { trades = []; saveAndRender(); } }
        
        function renderStats() {
            const total = trades.length; document.getElementById('stat-total').innerText = total;
            if (total === 0) { document.getElementById('stat-winrate').innerText = '0%'; document.getElementById('stat-rr').innerText = '0.00'; document.getElementById('stat-profit').innerText = '0.00 USDT'; return; }
            const wins = trades.filter(t => t.pnl > 0).length; document.getElementById('stat-winrate').innerText = ((wins / total) * 100).toFixed(1) + '%';
            const winTrades = trades.filter(t => t.pnl > 0); const loseTrades = trades.filter(t => t.pnl < 0);
            const avgWin = winTrades.reduce((acc, t) => acc + t.pnl, 0) / (winTrades.length || 1);
            const avgLose = Math.abs(trades.reduce((acc, t) => t.pnl < 0 ? acc + t.pnl : acc, 0) / (loseTrades.length || 1));
            document.getElementById('stat-rr').innerText = avgLose === 0 ? avgWin.toFixed(2) : (avgWin / avgLose).toFixed(2);
            const totalPnl = trades.reduce((acc, t) => acc + t.pnl, 0).toFixed(2);
            document.getElementById('stat-profit').innerText = totalPnl + ' USDT';
            document.getElementById('stat-profit').className = `text-2xl font-bold ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-500'}`;
        }

        function renderTrades() {
            const container = document.getElementById('trades-container');
            if (trades.length === 0) { container.innerHTML = '<div class="text-gray-500 py-4 text-sm text-center">目前沒有覆盤紀錄</div>'; return; }
            container.innerHTML = trades.map(t => {
                let imgsHtml = '';
                if(t.tvUrl1 && t.tvUrl1 !== '-') imgsHtml += `<a href="${t.tvUrl1}" target="_blank" class="bg-indigo-950/40 text-indigo-400 border border-indigo-900/50 px-2 py-1 rounded text-center hover:bg-indigo-900/50"><i class="fa-solid fa-image mr-1"></i>圖1(大)</a>`;
                if(t.tvUrl2 && t.tvUrl2 !== '-') imgsHtml += `<a href="${t.tvUrl2}" target="_blank" class="bg-indigo-950/40 text-indigo-400 border border-indigo-900/50 px-2 py-1 rounded text-center hover:bg-indigo-900/50"><i class="fa-solid fa-image mr-1"></i>圖2(中)</a>`;
                if(t.tvUrl3 && t.tvUrl3 !== '-') imgsHtml += `<a href="${t.tvUrl3}" target="_blank" class="bg-indigo-950/40 text-indigo-400 border border-indigo-900/50 px-2 py-1 rounded text-center hover:bg-indigo-900/50"><i class="fa-solid fa-image mr-1"></i>圖3(小)</a>`;
                if(t.tvUrl4 && t.tvUrl4 !== '-') imgsHtml += `<a href="${t.tvUrl4}" target="_blank" class="bg-indigo-950/40 text-indigo-400 border border-indigo-900/50 px-2 py-1 rounded text-center hover:bg-indigo-900/50"><i class="fa-solid fa-image mr-1"></i>圖4(出)</a>`;
                if(!imgsHtml) imgsHtml = '<span class="text-gray-600">無圖表紀錄</span>';

                return `
                <div class="bg-gray-900 p-5 rounded-xl border border-gray-800 space-y-3 text-sm">
                    <div class="flex justify-between items-start flex-wrap gap-2">
                        <div>
                            <span class="text-lg font-bold text-white">${t.symbol}</span> 
                            <span class="text-xs px-2 py-0.5 ml-2 rounded font-bold ${t.side==='Long'?'bg-emerald-500/20 text-emerald-400':'bg-rose-500/20 text-rose-400'}">${t.side} ${t.leverage}x</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-bold ${t.pnl>=0?'text-emerald-400':'text-rose-500'}">${t.pnl >= 0 ? '+' : ''}${t.pnl} USDT</span>
                            <button onclick="startEdit(${t.id})" class="bg-gray-800 hover:bg-amber-500/20 text-gray-400 hover:text-amber-400 text-xs px-2 py-1 rounded border border-gray-700 cursor-pointer ml-2"><i class="fa-solid fa-pen-to-square"></i> 編輯</button>
                            <button onclick="deleteTrade(${t.id})" class="text-gray-600 hover:text-rose-400 text-sm cursor-pointer ml-1">❌</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-gray-950 p-2.5 rounded text-xs text-gray-300">
                        <div>進場: <span class="text-white">${t.entry}</span></div>
                        <div>出場: <span class="text-white">${t.exit}</span></div>
                        <div>止盈: <span class="text-emerald-500">${t.tp}</span></div>
                        <div>止損: <span class="text-rose-500">${t.sl}</span></div>
                    </div>
                    ${(t.mod1!=='-'||t.mod2!=='-')?`
                    <div class="bg-gray-950/70 p-2.5 rounded text-xs text-amber-400 space-y-1 border border-amber-950/30">
                        ${t.mod1!=='-'?`<div><i class="fa-solid fa-circle-exclamation mr-1"></i>調整1: [${t.mod1}] 原因: ${t.reason1}</div>`:''}
                        ${t.mod2!=='-'?`<div><i class="fa-solid fa-circle-exclamation mr-1"></i>調整2: [${t.mod2}] 原因: ${t.reason2}</div>`:''}
                    </div>`:''}
                    <div class="text-xs text-gray-400">
                        <span class="text-gray-500 font-bold">開單理由：</span>${t.reason}
                    </div>
                    <div class="pt-1">
                        <div class="text-gray-500 font-bold text-xs mb-1.5">結構圖表 (多時框)：</div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                            ${imgsHtml}
                        </div>
                    </div>
                    <div class="bg-slate-950/80 p-3 rounded-lg border border-slate-800/60 mt-2">
                        <div class="text-indigo-400 font-bold text-xs mb-1 flex items-center"><i class="fa-solid fa-book-open mr-1"></i>個人覆盤心得筆記：</div>
                        <div class="text-xs text-gray-300 leading-relaxed whitespace-pre-wrap">${t.notes !== '-' ? t.notes : '無詳細筆記'}</div>
                    </div>
                </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
